services:
  pricing-service:
    build: .
    ports:
      - "5000:5000"
    environment:
      - APP_CONFIG=production
      - MONGO_URI=mongodb://mongo:27017/pricing_db
      - JWT_SECRET_KEY=super-secret-key
    depends_on:
      - mongo

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
